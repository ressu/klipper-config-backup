# Places SQUIGGLY_PURGE beside the print area, like KAMP's LINE_PURGE did.
# SQUIGGLY_PURGE's own adaptive mode only slides the line along the front edge,
# so prints that start near the front of the bed end up on top of the purge.
# This wrapper picks the first side (front, left, back, right) with LINE_MARGIN
# of free space, or the roomiest side if none has, and centers the line on the
# print along that side. Other parameters are passed through to SQUIGGLY_PURGE.
# The line length is assumed to be PERIODS * PERIOD_LENGTH, so LINE_WIDTH
# (solver mode) is not supported.

[gcode_macro ADAPTIVE_PURGE]
description: Purge with SQUIGGLY_PURGE on the free side of the print area
gcode:
    {% set margin = params.LINE_MARGIN|default(10.0)|float %}
    {% set edge = params.EDGE|default(5.0)|float %}
    {% set amplitude = params.AMPLITUDE|default(5.0)|float %}
    {% set length = params.PERIODS|default(10)|int * params.PERIOD_LENGTH|default(5.0)|float %}
    {% set verbose = params.VERBOSE|default(1)|int %}

    {% set forward = namespace(args="") %}
    {% for key, value in params.items() %}
        {% if key not in ["EDGE", "LINE_MARGIN", "LINE_DIRECTION", "START_X", "START_Y", "ADAPTIVE_MODE", "SIZE", "LINE_WIDTH"] %}
            {% set forward.args = forward.args ~ " " ~ key ~ "=" ~ value %}
        {% endif %}
    {% endfor %}

    {% set objects = printer.exclude_object.objects if printer.exclude_object is defined else [] %}
    {% if not objects %}
        {action_respond_info("ADAPTIVE_PURGE: no objects defined, purging at the default position")}
        SQUIGGLY_PURGE ADAPTIVE_MODE=0{forward.args}
    {% else %}
        {% set points = objects|map(attribute='polygon')|sum(start=[]) %}
        {% set x_min = points|map(attribute=0)|min %}
        {% set x_max = points|map(attribute=0)|max %}
        {% set y_min = points|map(attribute=1)|min %}
        {% set y_max = points|map(attribute=1)|max %}

        {% set bed_min = edge %}
        {% set bed_x_max = printer.toolhead.axis_maximum.x - edge %}
        {% set bed_y_max = printer.toolhead.axis_maximum.y - edge %}

        # Free space between the print and the far side of the line, per side.
        # The squiggle extends AMPLITUDE in +X/+Y from its start coordinate.
        {% set sides = [
            ("front", y_min - bed_min - amplitude),
            ("left", x_min - bed_min - amplitude),
            ("back", bed_y_max - amplitude - y_max),
            ("right", bed_x_max - amplitude - x_max),
        ] %}
        {% set pick = namespace(side=none, room=-1.0e9) %}
        {% for side, room in sides %}
            {% if pick.side is none and room >= margin %}
                {% set pick.side = side %}
                {% set pick.room = room %}
            {% endif %}
        {% endfor %}
        {% if pick.side is none %}
            {% for side, room in sides %}
                {% if room > pick.room %}
                    {% set pick.side = side %}
                    {% set pick.room = room %}
                {% endif %}
            {% endfor %}
        {% endif %}
        {% set gap = [pick.room, margin]|min %}

        {% if pick.side in ["front", "back"] %}
            {% set direction = "X" %}
            {% set across = y_min - gap - amplitude if pick.side == "front" else y_max + gap %}
            {% set along_center, along_max, along_mid = (x_min + x_max) / 2, bed_x_max, printer.toolhead.axis_maximum.x / 2 %}
        {% else %}
            {% set direction = "Y" %}
            {% set across = x_min - gap - amplitude if pick.side == "left" else x_max + gap %}
            {% set along_center, along_max, along_mid = (y_min + y_max) / 2, bed_y_max, printer.toolhead.axis_maximum.y / 2 %}
        {% endif %}

        # SQUIGGLY_PURGE runs toward the bed center: in + from a start below the
        # midpoint, in - from one above it. Start from the end that covers [lo, lo + length].
        {% set lo = [[along_center - length / 2, bed_min]|max, along_max - length]|min %}
        {% set along = lo if lo <= along_mid else lo + length %}
        {% set start_x, start_y = (along, across) if direction == "X" else (across, along) %}

        {% if verbose %}
            {action_respond_info("ADAPTIVE_PURGE: purging on the %s side at X=%.1f Y=%.1f, %.1f mm from the print" % (pick.side, start_x, start_y, gap))}
        {% endif %}
        {% if gap <= 0 %}
            {action_respond_info("ADAPTIVE_PURGE: no side has free space; the purge line on the %s side overlaps the print area by %.1f mm" % (pick.side, -gap))}
        {% elif gap < margin %}
            {action_respond_info("ADAPTIVE_PURGE: no side has %.1f mm of free space; the purge line is only %.1f mm from the print" % (margin, gap))}
        {% endif %}
        SQUIGGLY_PURGE ADAPTIVE_MODE=0 LINE_DIRECTION={direction} START_X={start_x} START_Y={start_y}{forward.args}
    {% endif %}
