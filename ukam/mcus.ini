[pico]
klipper_section: mcu
action_command: make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_rp2040_4550357128931D58-if00

[picobilical]
klipper_section: mcu umb
action_command: make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_rp2040_3252343737077819-if00

[host]
klipper_section: mcu host
action_command: make flash

[display]
klipper_section: mcu displayEncoder
quiet_command: enter_bootloader -t usb -d /dev/serial/by-id/usb-Klipper_stm32f042x6_2C0005800743564E32313720-if00
action_command: ~/klippy-env/bin/python3 ~/katapult/scripts/flashtool.py -d /dev/serial/by-id/usb-katapult_stm32f042x6_2C0005800743564E32313720-if00
