[filter_monitor nevermore]
fan: fan_generic nevermore
path: ~/printer_data/misc/
expiry_gcode: _FILTER_NOTIFY

[gcode_macro _FILTER_NOTIFY]
description: Notify mobileraker about filter media expiring
gcode:
  MR_NOTIFY TITLE="$printer_name Filter Media Expired" MESSAGE="Filter media expired, please replace"

[gcode_macro _NEVERMORE_AUTO]
description: Automatically turn on nevermore
gcode:
  {% set chamber = params.CHAMBER|default(0)|int %}
  {% set material = params.MATERIAL|default('ABS')|string %}

  {% if material in ('ABS') %}
     _NEVERMORE_ON
  {% elif material in ('PLA', 'PETG') %}
     _NEVERMORE_OFF
  {% elif chamber >= 20 %}
     {action_respond_info("Material is %s, chamber set to %d. Defaulting to Nevermore ON" % (material, chamber))}
     _NEVERMORE_ON
  {% endif %}

[gcode_macro _NEVERMORE_ON]
description: helper for turning on nevermore
gcode:
  SET_FAN_SPEED FAN=nevermore SPEED=0.8

[gcode_macro _NEVERMORE_OFF]
description: helper for turning on nevermore
gcode:
  SET_FAN_SPEED FAN=nevermore SPEED=0